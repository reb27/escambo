definitions:
  imagenshandler.DeletarImagemRequest:
    properties:
      url:
        type: string
    type: object
  loginhandler.LoginRequest:
    properties:
      email:
        type: string
      senha:
        type: string
    type: object
  loginhandler.LoginResponse:
    properties:
      token:
        type: string
    type: object
  postagemhandler.DesfavoritarPostagemRequest:
    properties:
      postagem_id:
        type: string
      user_id:
        type: string
    type: object
  postagemhandler.FavoritarPostagemRequest:
    properties:
      postagem_id:
        type: string
      user_id:
        type: string
    type: object
  postagemhandler.PostagemResponse:
    properties:
      id:
        type: string
      message:
        type: string
    type: object
  postagemrepo.Postagem:
    properties:
      ativa:
        type: boolean
      bairro:
        type: string
      categoria:
        type: string
      cidade:
        type: string
      criacao_em:
        type: string
      descricao:
        type: string
      estado:
        type: string
      id:
        type: string
      imagens:
        items:
          type: string
        type: array
      marcado_como_favorito:
        type: boolean
      nome_usuario:
        type: string
      titulo:
        type: string
      user_id:
        type: string
    type: object
  postagemrepo.PostagemEdicao:
    properties:
      categoria:
        type: string
      descricao:
        type: string
      id:
        type: string
      status:
        type: boolean
      titulo:
        type: string
    type: object
  postagemsvc.Postagem:
    properties:
      categoria:
        type: string
      descricao:
        type: string
      imagens:
        items:
          type: string
        type: array
      marcado_como_favorito:
        type: boolean
      titulo:
        type: string
      user_id:
        type: string
    type: object
  postagemsvc.PostagemWrite:
    properties:
      categoria:
        type: string
      descricao:
        type: string
      titulo:
        type: string
      user_id:
        type: string
    type: object
  propostahandler.StatusUpdatePayload:
    properties:
      status:
        type: string
    type: object
  propostarepo.Produto:
    properties:
      categoria:
        type: string
      descricao:
        type: string
      imagens:
        items:
          type: string
        type: array
      nome:
        type: string
      usuario:
        type: string
    type: object
  propostarepo.PropostaFormatada:
    properties:
      id_proposta:
        type: string
      produto_postagem:
        $ref: '#/definitions/propostarepo.Produto'
      produto_proposta_troca:
        $ref: '#/definitions/propostarepo.Produto'
      status:
        type: string
    type: object
  propostarepo.PropostaWriteModel:
    properties:
      categoria:
        type: string
      descricao:
        type: string
      dono_postagem_id:
        type: string
      interessado_id:
        type: string
      nome:
        type: string
      postagem_id:
        type: string
    type: object
  usuariorepo.ReadUsuario:
    properties:
      email:
        type: string
      id:
        type: string
      nome:
        type: string
      telefone:
        type: string
    type: object
  usuariorepo.WriteUsuario:
    properties:
      bairro:
        type: string
      cep:
        type: string
      cidade:
        type: string
      email:
        type: string
      estado:
        type: string
      nome:
        type: string
      numero:
        type: integer
      rua:
        type: string
      senha:
        type: string
      telefone:
        type: string
    type: object
info:
  contact: {}
  description: API para gerenciamento de postagens e trocas de escambo.
  termsOfService: http://swagger.io/terms/
  title: Escambo API
  version: "1.0"
paths:
  /favoritos:
    delete:
      consumes:
      - application/json
      description: Remove uma postagem dos favoritos de um usuário.
      parameters:
      - description: Dados para desfavoritar postagem
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/postagemhandler.DesfavoritarPostagemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Request inválido
          schema:
            type: string
        "500":
          description: Erro ao desfavoritar
          schema:
            type: string
      summary: Desfavoritar uma postagem
      tags:
      - favoritos
    post:
      consumes:
      - application/json
      description: Marca uma postagem como favorita para um usuário.
      parameters:
      - description: Dados para favoritar postagem
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/postagemhandler.FavoritarPostagemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Request inválido
          schema:
            type: string
        "500":
          description: Erro ao favoritar
          schema:
            type: string
      summary: Favoritar uma postagem
      tags:
      - favoritos
  /favoritos/{id}:
    get:
      consumes:
      - application/json
      description: Retorna a lista de favoritos para um usuário específico.
      parameters:
      - description: ID do usuário
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/postagemrepo.Postagem'
            type: array
        "400":
          description: userID obrigatório
          schema:
            type: string
        "500":
          description: Erro ao buscar favoritos
          schema:
            type: string
      summary: Lista favoritos de um usuário
      tags:
      - favoritos
  /login:
    post:
      consumes:
      - application/json
      description: Autentica um usuário e retorna token JWT para autenticação nas
        rotas protegidas.
      parameters:
      - description: Email e senha do usuário
        in: body
        name: loginRequest
        required: true
        schema:
          $ref: '#/definitions/loginhandler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token JWT gerado
          schema:
            $ref: '#/definitions/loginhandler.LoginResponse'
        "400":
          description: Email e senha são obrigatórios
          schema:
            type: string
        "401":
          description: Email ou senha inválidos
          schema:
            type: string
        "403":
          description: Usuário temporariamente bloqueado
          schema:
            type: string
        "500":
          description: Erro interno
          schema:
            type: string
      summary: Login de usuário
      tags:
      - autenticação
  /me:
    get:
      consumes:
      - application/json
      description: Retorna os dados do usuário com base no token de autenticação
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usuariorepo.ReadUsuario'
        "401":
          description: Não autorizado
          schema:
            type: string
        "500":
          description: Erro interno do servidor
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Retorna o usuário autenticado
      tags:
      - usuarios
  /postagens:
    get:
      consumes:
      - application/json
      description: Retorna uma lista de postagens de acordo com os filtros fornecidos
      parameters:
      - description: Categoria da postagem
        in: query
        name: categoria
        type: string
      - description: ID de um usuario
        in: query
        name: id_usuario
        type: string
      - description: Ordenação das datas DESC ou ASC
        in: query
        name: ordenacao
        type: string
      - description: Número máximo de postagens por página
        in: query
        name: limite
        type: integer
      - description: Palavra-chave para busca por título ou descrição
        in: query
        name: busca
        type: string
      - description: Número da página de resultados
        in: query
        name: pagina
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/postagemrepo.Postagem'
            type: array
        "500":
          description: Erro ao listar postagens
          schema:
            type: string
      summary: Lista postagens com filtros opcionais
      tags:
      - postagens
    post:
      consumes:
      - application/json
      description: Cria uma nova postagem no sistema com os dados fornecidos no corpo
        da requisição
      parameters:
      - description: Nova postagem
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/postagemsvc.PostagemWrite'
      produces:
      - application/json
      responses:
        "201":
          description: Postagem inserida com sucesso
          schema:
            $ref: '#/definitions/postagemhandler.PostagemResponse'
        "400":
          description: Erro ao decodificar corpo da requisição
          schema:
            type: string
        "500":
          description: Erro ao salvar postagem
          schema:
            type: string
      summary: Insere uma nova postagem
      tags:
      - postagens
    put:
      consumes:
      - application/json
      description: Atualiza os dados de uma postagem específica com base no JSON recebido
      parameters:
      - description: Dados para edição da postagem
        in: body
        name: postagem
        required: true
        schema:
          $ref: '#/definitions/postagemrepo.PostagemEdicao'
      produces:
      - application/json
      responses:
        "200":
          description: Mensagem de sucesso
        "400":
          description: Requisição inválida
        "500":
          description: Erro interno ao atualizar postagem
      summary: Atualiza uma postagem
      tags:
      - postagens
  /postagens/{id}:
    delete:
      description: Remove uma postagem do sistema.
      parameters:
      - description: ID da postagem
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Postagem deletada com sucesso
        "400":
          description: ID inválido
          schema:
            type: string
        "500":
          description: Erro ao deletar postagem
          schema:
            type: string
      summary: Deletar uma postagem
      tags:
      - postagens
  /postagens/{id}/detalhes:
    get:
      consumes:
      - application/json
      description: Retorna todas as informações de uma postagem com base no ID fornecido.
      parameters:
      - description: ID da Postagem
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/postagemsvc.Postagem'
        "401":
          description: Não autorizado
          schema:
            type: string
        "500":
          description: Erro interno ao buscar a postagem ou ao codificar a resposta
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Buscar detalhes da postagem
      tags:
      - postagens
  /postagens/{id}/imagem:
    delete:
      consumes:
      - application/json
      description: Deleta uma imagem do S3 e remove a URL do campo imagem_url da tabela
        postagens
      parameters:
      - description: ID da Postagem
        in: path
        name: id
        required: true
        type: string
      - description: URL da imagem a ser removida
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/imagenshandler.DeletarImagemRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Imagem deletada com sucesso
          schema:
            type: string
        "400":
          description: Requisição inválida
        "500":
          description: Erro interno
      summary: Remove uma imagem da postagem
      tags:
      - postagens
    post:
      consumes:
      - multipart/form-data
      description: Recebe um arquivo de imagem e o UUID de uma postagem. Retorna status
        202 em caso de sucesso.
      parameters:
      - description: UUID da postagem
        in: path
        name: id
        required: true
        type: string
      - description: Arquivo de imagem (máx 10MB)
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "202":
          description: Status Accepted (202)
        "400":
          description: Erro na leitura da imagem ou ID inválido
          schema:
            type: string
        "500":
          description: Erro interno no upload
          schema:
            type: string
      summary: Upload de imagem de postagem
      tags:
      - postagens
  /trocas:
    post:
      consumes:
      - application/json
      description: Registra uma proposta de troca com base nos dados enviados
      parameters:
      - description: Dados da proposta
        in: body
        name: proposta
        required: true
        schema:
          $ref: '#/definitions/propostarepo.PropostaWriteModel'
      produces:
      - application/json
      responses:
        "201":
          description: Proposta criada com sucesso e ID retornado
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Body inválido
          schema:
            type: string
        "500":
          description: Erro ao salvar proposta
          schema:
            type: string
      summary: Cadastra nova proposta
      tags:
      - trocas
  /trocas/{id}/historico:
    get:
      description: Retorna propostas enviadas ou recebidas por um usuário com base
        no tipo e status
      parameters:
      - description: ID do usuário
        in: path
        name: id
        required: true
        type: string
      - description: Tipo de proposta (enviadas ou recebidas)
        in: query
        name: tipo
        required: true
        type: string
      - description: Status da proposta (pendente, aceita, recusada)
        in: query
        name: status
        type: string
      - description: 'Limite de resultados (ex: 10)'
        in: query
        name: limit
        type: integer
      - description: 'Deslocamento de resultados (ex: 20)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/propostarepo.PropostaFormatada'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Lista propostas do usuário
      tags:
      - trocas
  /trocas/{id}/imagem:
    post:
      consumes:
      - multipart/form-data
      description: Recebe um arquivo de imagem e o UUID de uma troca. Retorna status
        202 em caso de sucesso.
      parameters:
      - description: UUID da troca
        in: path
        name: id
        required: true
        type: string
      - description: Arquivo de imagem (máx 10MB)
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "202":
          description: Status Accepted (202)
        "400":
          description: Erro na leitura da imagem ou ID inválido
          schema:
            type: string
        "500":
          description: Erro interno no upload
          schema:
            type: string
      summary: Upload de imagem de troca
      tags:
      - trocas
  /trocas/{id}/status:
    put:
      consumes:
      - application/json
      description: Altera o status da proposta (aceita, recusada, pendente)
      parameters:
      - description: ID da proposta
        in: path
        name: id
        required: true
        type: string
      - description: Novo status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/propostahandler.StatusUpdatePayload'
      responses:
        "204":
          description: Atualizado com sucesso
          schema:
            type: string
        "400":
          description: Erro de validação
          schema:
            type: string
        "500":
          description: Erro interno
          schema:
            type: string
      summary: Atualiza o status da proposta
      tags:
      - trocas
  /usuarios:
    post:
      consumes:
      - application/json
      description: Insere um usuário no sistema com base nos dados fornecidos no corpo
        da requisição
      parameters:
      - description: Dados da proposta
        in: body
        name: proposta
        required: true
        schema:
          $ref: '#/definitions/usuariorepo.WriteUsuario'
      produces:
      - application/json
      responses:
        "201":
          description: Usuário inserido com sucesso e ID retornado
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Erro ao decodificar corpo da requisição
          schema:
            type: string
        "409":
          description: Já existe um cadastro com esse e-mail
          schema:
            type: string
        "500":
          description: Erro interno do servidor
          schema:
            type: string
      summary: Cadastra um novo usuário
      tags:
      - usuarios
  /usuarios/{id}:
    get:
      consumes:
      - application/json
      description: Retorna os dados de um usuário identificado pelo ID
      parameters:
      - description: ID do usuário
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usuariorepo.ReadUsuario'
        "400":
          description: ID inválido
          schema:
            type: string
        "404":
          description: Usuário não encontrado
          schema:
            type: string
        "500":
          description: Erro interno do servidor
          schema:
            type: string
      summary: Busca um usuário
      tags:
      - usuarios
    put:
      consumes:
      - application/json
      description: Atualiza as informações de um usuário identificado pelo ID
      parameters:
      - description: ID do usuário
        in: path
        name: id
        required: true
        type: string
      - description: Dados atualizados do usuário
        in: body
        name: usuario
        required: true
        schema:
          $ref: '#/definitions/usuariorepo.WriteUsuario'
      produces:
      - text/plain
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Erro ao decodificar corpo da requisição
          schema:
            type: string
        "500":
          description: Erro interno do servidor
          schema:
            type: string
      summary: Atualiza dados de um usuário
      tags:
      - usuarios
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

definitions:
  postagemsvc.Postagem:
    properties:
      categoria:
        type: string
      descricao:
        type: string
      imagens:
        items:
          type: string
        type: array
      titulo:
        type: string
      user_id:
        type: string
    type: object
  propostahandler.StatusUpdatePayload:
    properties:
      status:
        type: string
    type: object
  propostarepo.Produto:
    properties:
      categoria:
        type: string
      descricao:
        type: string
      imagem:
        type: string
      nome:
        type: string
      usuario:
        type: string
    type: object
  propostarepo.PropostaFormatada:
    properties:
      produto_postagem:
        $ref: '#/definitions/propostarepo.Produto'
      produto_proposta_troca:
        $ref: '#/definitions/propostarepo.Produto'
      status:
        type: string
    type: object
  usuariorepo.ReadUsuario:
    properties:
      email:
        type: string
      id:
        type: string
      nome:
        type: string
      telefone:
        type: string
    type: object
  usuariorepo.WriteUsuario:
    properties:
      email:
        type: string
      nome:
        type: string
      senha:
        type: string
      telefone:
        type: string
    type: object
info:
  contact: {}
paths:
  /postagens:
    post:
      consumes:
      - application/json
      description: Cria uma nova postagem no sistema com os dados fornecidos no corpo
        da requisição
      produces:
      - application/json
      responses:
        "200":
          description: Postagem inserida com sucesso
          schema:
            type: string
        "400":
          description: Erro ao decodificar corpo da requisição
          schema:
            type: string
        "500":
          description: Erro ao salvar postagem
          schema:
            type: string
      summary: Insere uma nova postagem
      tags:
      - postagens
  /postagens/{id}/detalhes:
    get:
      consumes:
      - application/json
      description: Retorna todas as informações de uma postagem com base no ID fornecido.
      parameters:
      - description: ID da Postagem
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/postagemsvc.Postagem'
        "500":
          description: Erro interno ao buscar a postagem ou ao codificar a resposta
          schema:
            type: string
      summary: Buscar detalhes da postagem
      tags:
      - postagens
  /postagens/{id}/imagem:
    post:
      consumes:
      - multipart/form-data
      description: Recebe um arquivo de imagem e o UUID de uma postagem. Retorna status
        202 em caso de sucesso.
      parameters:
      - description: UUID da postagem
        in: path
        name: id
        required: true
        type: string
      - description: Arquivo de imagem (máx 10MB)
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "202":
          description: Status Accepted (202)
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Erro na leitura da imagem ou ID inválido
          schema:
            type: string
        "500":
          description: Erro interno no upload
          schema:
            type: string
      summary: Upload de imagem de postagem
      tags:
      - postagens
  /trocas:
    post:
      consumes:
      - application/json
      description: Registra uma proposta de troca com base nos dados enviados
      produces:
      - application/json
      responses:
        "201":
          description: Proposta criada com sucesso e ID retornado
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Body inválido
          schema:
            type: string
        "500":
          description: Erro ao salvar proposta
          schema:
            type: string
      summary: Cadastra nova proposta
      tags:
      - trocas
  /trocas/{id}/historico:
    get:
      description: Retorna propostas enviadas ou recebidas por um usuário com base
        no tipo e status
      parameters:
      - description: ID do usuário
        in: path
        name: id
        required: true
        type: string
      - description: Tipo de proposta (enviadas ou recebidas)
        in: query
        name: tipo
        required: true
        type: string
      - description: Status da proposta (pendente, aceita, recusada)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              items:
                $ref: '#/definitions/propostarepo.PropostaFormatada'
              type: array
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Lista propostas do usuário
      tags:
      - trocas
  /trocas/{id}/imagem:
    post:
      consumes:
      - multipart/form-data
      description: Recebe um arquivo de imagem e o UUID de uma troca. Retorna status
        202 em caso de sucesso.
      parameters:
      - description: UUID da troca
        in: path
        name: id
        required: true
        type: string
      - description: Arquivo de imagem (máx 10MB)
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "202":
          description: Status Accepted (202)
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Erro na leitura da imagem ou ID inválido
          schema:
            type: string
        "500":
          description: Erro interno no upload
          schema:
            type: string
      summary: Upload de imagem de troca
      tags:
      - trocas
  /trocas/{id}/status:
    put:
      consumes:
      - application/json
      description: Altera o status da proposta (aceita, recusada, pendente)
      parameters:
      - description: ID da proposta
        in: path
        name: id
        required: true
        type: string
      - description: Novo status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/propostahandler.StatusUpdatePayload'
      responses:
        "204":
          description: Atualizado com sucesso
          schema:
            type: string
        "400":
          description: Erro de validação
          schema:
            type: string
        "500":
          description: Erro interno
          schema:
            type: string
      summary: Atualiza o status da proposta
      tags:
      - trocas
  /usuarios:
    post:
      consumes:
      - application/json
      description: Insere um usuário no sistema com base nos dados fornecidos no corpo
        da requisição
      produces:
      - application/json
      responses:
        "201":
          description: Usuário inserido com sucesso e ID retornado
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Erro ao decodificar corpo da requisição
          schema:
            type: string
        "409":
          description: Já existe um cadastro com esse e-mail
          schema:
            type: string
        "500":
          description: Erro interno do servidor
          schema:
            type: string
      summary: Cadastra um novo usuário
      tags:
      - usuarios
  /usuarios/{id}:
    get:
      consumes:
      - application/json
      description: Retorna os dados de um usuário identificado pelo ID
      parameters:
      - description: ID do usuário
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usuariorepo.ReadUsuario'
        "400":
          description: ID inválido
          schema:
            type: string
        "404":
          description: Usuário não encontrado
          schema:
            type: string
        "500":
          description: Erro interno do servidor
          schema:
            type: string
      summary: Busca um usuário
      tags:
      - usuarios
    put:
      consumes:
      - application/json
      description: Atualiza as informações de um usuário identificado pelo ID
      parameters:
      - description: ID do usuário
        in: path
        name: id
        required: true
        type: string
      - description: Dados atualizados do usuário
        in: body
        name: usuario
        required: true
        schema:
          $ref: '#/definitions/usuariorepo.WriteUsuario'
      produces:
      - text/plain
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Erro ao decodificar corpo da requisição
          schema:
            type: string
        "500":
          description: Erro interno do servidor
          schema:
            type: string
      summary: Atualiza dados de um usuário
      tags:
      - usuarios
swagger: "2.0"
